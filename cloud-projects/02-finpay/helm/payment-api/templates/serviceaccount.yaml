{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "payment-api.serviceAccountName" . }}
  labels:
    {{- include "payment-api.labels" . | nindent 4 }}
  annotations:
    {{- if and .Values.workloadIdentity.enabled .Values.workloadIdentity.clientId }}
    azure.workload.identity/client-id: {{ .Values.workloadIdentity.clientId | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount | default true }}
{{- end }}
