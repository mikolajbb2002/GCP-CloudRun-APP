environment: dev
imagePullSecrets: []

serviceAccount:
  create: true
  name: payment-api-sa
  automount: true
  annotations: {}

workloadIdentity:
  enabled: false

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false   # ruch idzie przez Gateway API + HTTPRoute (osobny manifest)

deployment:
  replicaCount: 1
  name: payment-api
  image:
    repository: europe-central2-docker.pkg.dev/akademiamikolajpiedawid/repo02/payment-api
    tag: "v1"
    pullPolicy: IfNotPresent
  containerPort: 8080
  resources:
    requests:
      cpu: "50m"
      memory: "100Mi"
    limits:
      cpu: "500m"
      memory: "500Mi"
  probes:
    liveness:
      path: /actuator/health/liveness
      port: 8080
      initialDelaySeconds: 3
      periodSeconds: 10
    readiness:
      path: /actuator/health/readiness
      port: 8080
      initialDelaySeconds: 15
      periodSeconds: 5
    startup:
      path: /actuator/health
      port: 8080
      initialDelaySeconds: 30
      failureThreshold: 30
      periodSeconds: 10
  env:
    PAYMENT_DB_URL: "jdbc:postgresql://10.100.160.3:5432/postgres?sslmode=require"
    PAYMENT_DB_USER: "postgres"
    PAYMENT_WORKER_BASE_URL: "http://payment-worker-payment-worker-worker-service.worker-ns.svc.cluster.local:8090"
    PAYMENT_DB_PASSWORD: "P@ssw0rd"
secretsStore:
  enabled: false

secretProviderClass:
  enabled: false
  syncSecret:
    enabled: false

storageClass:
  enabled: false

secrets:
  enabled: false

hpa:
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 60
  metrics:
    type: Resource
    resource:
      name: cpu
      targetType: Utilization

networkPolicy:
  enabled: false
