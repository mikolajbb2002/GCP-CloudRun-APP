services:
  db:
    image: postgres:16
    container_name: payments-db
    env_file:
      - compose.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5

  payment-worker:
    build:
      context: ./payment-worker
      dockerfile: Dockerfile.worker
    container_name: payment-worker
    env_file:
      - compose.env
    depends_on:
      db:
        condition: service_healthy
    environment:
      PAYMENT_WORKER_PORT: "${PAYMENT_WORKER_PORT}"
      PAYMENT_API_BASE_URL: "${PAYMENT_API_BASE_URL}"
      WORKER_CPU_LOAD_MS: "${WORKER_CPU_LOAD_MS}"
    ports:
      - "8090:8090"

  payment-api:
    build:
      context: ./payment-api
      dockerfile: Dockerfile.api
    container_name: payment-api
    env_file:
      - compose.env
    depends_on:
      db:
        condition: service_healthy
      payment-worker:
        condition: service_started
    environment:
      PAYMENT_DB_URL: "${PAYMENT_DB_URL}"
      PAYMENT_DB_USER: "${PAYMENT_DB_USER}"
      PAYMENT_DB_PASSWORD: "${PAYMENT_DB_PASSWORD}"
      PAYMENT_WORKER_BASE_URL: "${PAYMENT_WORKER_BASE_URL}"
    ports:
      - "8080:8080"
